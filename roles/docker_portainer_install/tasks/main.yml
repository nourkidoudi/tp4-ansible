---
- name: Installer Docker, Compose et le SDK Python Docker
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
      - python3-docker
    state: present
    update_cache: true

- name: Docker démarré et activé au boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Lancer Portainer
  community.docker.docker_container:
    name: portainer
    image: portainer/portainer-ce:latest
    restart_policy: always
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
  register: portainer_result
  retries: 3
  delay: 10
  until: portainer_result is succeeded
